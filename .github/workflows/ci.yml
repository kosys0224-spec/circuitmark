name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        shell: bash
        run: |
          circuitmark --version
          circuitmark symbols
          circuitmark check -W examples/*.ckt examples/README.md
          circuitmark render examples/*.ckt -o out/
          ls out
      - name: Docs are up to date (generated SVGs match the sources)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/make_docs.py
          git diff --exit-code -- docs/examples docs/symbols.svg examples/README.md
