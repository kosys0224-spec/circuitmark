name: Bug report
description: Crash, wrong drawing, or installation problem
labels: [bug]
body:
  - type: textarea
    id: source
    attributes:
      label: The circuit source (.ckt or the ```circuit block)
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect? (attach the SVG or a screenshot if it rendered)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: circuitmark --version, Python version, OS
    validations:
      required: true
