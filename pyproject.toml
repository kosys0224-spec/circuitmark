[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitmark"
version = "0.1.0"
description = "Write circuit diagrams as text (Mermaid-style) and render them to SVG, standalone or inside Markdown. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Inhyeok Park" }]
keywords = ["circuit", "schematic", "diagram", "svg", "markdown", "mermaid", "electronics", "documentation", "text-to-diagram", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Documentation",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kosys0224-spec/circuitmark"
Documentation = "https://github.com/kosys0224-spec/circuitmark/blob/main/docs/syntax.md"
Issues = "https://github.com/kosys0224-spec/circuitmark/issues"
Changelog = "https://github.com/kosys0224-spec/circuitmark/blob/main/CHANGELOG.md"

[project.scripts]
circuitmark = "circuitmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuitmark = ["py.typed"]
